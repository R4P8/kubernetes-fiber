apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: go-fiber
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: jaeger
      protocol: TCP
      port: 16686      
      targetPort: 16686
    - name: http-collector
      protocol: TCP
      port: 14268
      targetPort: 14268
    - name: grpc-collector
      protocol: TCP
      port: 14250
      targetPort: 14250
  type: ClusterIP

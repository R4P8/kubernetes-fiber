apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: go-fiber
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: jaeger
      protocol: TCP
      port: 16686      
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
  type: ClusterIP

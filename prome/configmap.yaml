apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: go-fiber
data:
  prometheus.yaml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector:9464'] 

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']

       - job_name: 'prometheus'
         static_configs:
          - targets: ['localhost:9090']


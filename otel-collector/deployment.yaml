apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: go-fiber
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:latest
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics
            - containerPort: 9464
              name: prome
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol/config.yaml
              subPath: config.yaml
      volumes:
        - name: otel-config
          configMap:
            name: otel-config
      initContainers:
        - name: wait-for-jaeger
          image: busybox
          command: ['sh', '-c', 'until nc -z jaeger 14250; do echo "waiting for jaeger..."; sleep 3; done']

